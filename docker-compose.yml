services:
  mongo:
    image: mongo:7
    container_name: twh-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    container_name: twh-api
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongo:27017/twh_db
    ports:
      - "5000:5000"

volumes:
  mongo_data:
